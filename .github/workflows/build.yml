name: Build

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, and validate package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore PNFmt.slnx

      - name: Verify formatting
        run: dotnet format PNFmt.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build PNFmt.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test PNFmt.slnx --configuration Release --no-build --no-restore

      - name: Pack and validate global tool
        shell: pwsh
        run: >
          ./scripts/Publish-GlobalTool.ps1
          -Version "0.0.0-ci.$env:GITHUB_RUN_NUMBER"
          -Configuration Release
          -SkipTests
          -PackOnly
