name: Build

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, and validate package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore PNFmt.slnx

      - name: Verify formatting
        shell: pwsh
        run: |
          $output = dotnet format PNFmt.slnx --verify-no-changes --no-restore --verbosity diagnostic 2>&1
          $formatExitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($formatExitCode -ne 0) {
            exit $formatExitCode
          }
          if ($output -match 'Found project reference without a matching metadata reference:') {
            throw 'Formatting verification loaded an incomplete project graph.'
          }

      - name: Build
        run: dotnet build PNFmt.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test PNFmt.slnx --configuration Release --no-build --no-restore

      - name: Pack and validate global tool
        shell: pwsh
        run: >
          ./scripts/Publish-GlobalTool.ps1
          -Version "0.0.0-ci.$env:GITHUB_RUN_NUMBER"
          -Configuration Release
          -SkipTests
          -PackOnly
