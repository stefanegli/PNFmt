name: Build

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, and validate package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore PNFmt.slnx

      - name: Verify formatting
        shell: pwsh
        run: |
          $output = dotnet format PNFmt.slnx --verify-no-changes --no-restore --verbosity diagnostic 2>&1
          $formatExitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($formatExitCode -ne 0) {
            exit $formatExitCode
          }
          if ($output -match 'Found project reference without a matching metadata reference:') {
            throw 'Formatting verification loaded an incomplete project graph.'
          }

      - name: Build
        run: dotnet build PNFmt.slnx --configuration Release --no-restore

      - name: Verify PNFmt source and configuration formatting
        shell: pwsh
        run: ./scripts/Format-Repository.ps1 -Check -Configuration Release -NoBuild

      - name: Verify coverage gate
        shell: pwsh
        run: ./scripts/Test-CoverageReport.Tests.ps1

      - name: Restore coverage history
        uses: actions/cache/restore@v6
        with:
          path: artifacts/coverage-history/
          key: coverage-history-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: coverage-history-${{ runner.os }}-

      - name: Test with coverage
        shell: pwsh
        run: ./scripts/Test-Coverage.ps1 -Configuration Release -NoBuild -NoRestore

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}
          path: artifacts/coverage/
          if-no-files-found: warn

      - name: Save coverage history
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/save@v6
        with:
          path: artifacts/coverage-history/
          key: coverage-history-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Validate benchmark scenarios
        run: dotnet run --project benchmarks/PNFmt.Benchmarks.csproj --configuration Release --no-build -- --quick

      - name: Pack and validate global tool
        shell: pwsh
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: >
          ./scripts/Publish-GlobalTool.ps1
          -Version "0.0.0-ci.$env:GITHUB_RUN_NUMBER"
          -Configuration Release
          -SkipTests
          -PackOnly

      - name: Upload performance reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: performance-${{ matrix.os }}
          path: artifacts/performance/
          if-no-files-found: warn
