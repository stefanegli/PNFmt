name: Build

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build versioned package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Test release validation
        shell: pwsh
        run: |
          node --test .github/scripts/select-release-build.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Release build selection tests failed.' }
          ./scripts/Test-ReleasePackage.Tests.ps1

      - name: Pack release candidate
        id: package
        shell: pwsh
        run: |
          $version = (dotnet msbuild PNFmt.Cli/PNFmt.Cli.csproj -getProperty:Version -nologo | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the package version.' }
          dotnet pack PNFmt.Cli/PNFmt.Cli.csproj --configuration Release --output artifacts/release-package "-p:RepositoryCommit=$env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) { throw 'Package build failed.' }
          ./scripts/Test-ReleasePackage.ps1 -PackageDirectory artifacts/release-package -Version $version -Commit $env:GITHUB_SHA
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Upload release candidate
        uses: actions/upload-artifact@v7
        with:
          name: release-package
          path: artifacts/release-package/*.nupkg
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  build:
    name: Build, test, and validate package (${{ matrix.os }})
    needs: package
    # These are required checks: a failed package job must fail them, not skip them.
    if: always()
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Require package build to pass
        if: needs.package.result != 'success'
        shell: pwsh
        run: throw 'The release candidate package job did not pass.'

      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore PNFmt.slnx

      - name: Verify formatting
        shell: pwsh
        run: |
          $output = dotnet format PNFmt.slnx --verify-no-changes --no-restore --verbosity diagnostic 2>&1
          $formatExitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($formatExitCode -ne 0) {
            exit $formatExitCode
          }
          if ($output -match 'Found project reference without a matching metadata reference:') {
            throw 'Formatting verification loaded an incomplete project graph.'
          }

      - name: Build
        run: dotnet build PNFmt.slnx --configuration Release --no-restore

      - name: Verify PNFmt source and configuration formatting
        shell: pwsh
        run: ./scripts/Format-Repository.ps1 -Check -Configuration Release -NoBuild

      - name: Verify coverage gate
        shell: pwsh
        run: ./scripts/Test-CoverageReport.Tests.ps1

      - name: Restore coverage history
        uses: actions/cache/restore@v6
        with:
          path: artifacts/coverage-history/
          key: coverage-history-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: coverage-history-${{ runner.os }}-

      - name: Test with coverage
        shell: pwsh
        run: ./scripts/Test-Coverage.ps1 -Configuration Release -NoBuild -NoRestore

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}
          path: artifacts/coverage/
          if-no-files-found: warn

      - name: Save coverage history
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/save@v6
        with:
          path: artifacts/coverage-history/
          key: coverage-history-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Validate benchmark scenarios
        run: dotnet run --project benchmarks/PNFmt.Benchmarks.csproj --configuration Release --no-build -- --quick

      - name: Compare performance with pinned baseline
        shell: pwsh
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          ./scripts/Test-PerformanceReport.Tests.ps1
          ./scripts/Test-Performance.ps1 -TimingPolicy ReportOnly

      - name: Download release candidate
        uses: actions/download-artifact@v8
        with:
          name: release-package
          path: artifacts/release-package

      - name: Validate installed package
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ needs.package.outputs.version }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          $package = ./scripts/Test-ReleasePackage.ps1 -PackageDirectory artifacts/release-package -Version $env:PACKAGE_VERSION -Commit $env:GITHUB_SHA
          ./scripts/Test-ToolPackage.ps1 -PackagePath $package -Version $env:PACKAGE_VERSION

      - name: Upload performance reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: performance-${{ matrix.os }}
          path: artifacts/performance/
          if-no-files-found: warn
