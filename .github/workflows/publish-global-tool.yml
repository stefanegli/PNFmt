name: Publish .NET global tool

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-global-tool
  cancel-in-progress: false

jobs:
  publish:
    name: Publish PetchNaka.PNFmt.Cli
    runs-on: ubuntu-latest
    environment: nuget
    timeout-minutes: 30

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Resolve package version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?)$') {
              throw "Tag '$tag' must use the form v<major>.<minor>.<patch>[-prerelease]."
          }

          "PACKAGE_VERSION=$($Matches.version)" >> $env:GITHUB_ENV

      - name: Validate trusted publishing configuration
        shell: pwsh
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_USER)) {
              throw "Set the repository variable 'NUGET_USER' to the nuget.org profile name."
          }

      - name: Test, pack, and validate tool
        shell: pwsh
        run: |
          ./scripts/Publish-GlobalTool.ps1 `
            -Version $env:PACKAGE_VERSION `
            -Configuration Release `
            -PackOnly | Tee-Object -Variable validationOutput
          $validatedPackage = $validationOutput | Select-Object -Last 1
          if (-not (Test-Path -LiteralPath $validatedPackage -PathType Leaf)) {
            throw 'Validation did not return a package path.'
          }
          "VALIDATED_PACKAGE_PATH=$validatedPackage" >> $env:GITHUB_ENV

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-release
          path: artifacts/coverage/
          if-no-files-found: warn

      - name: Log in to NuGet.org with trusted publishing
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish tool package
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: >
          dotnet nuget push "$env:VALIDATED_PACKAGE_PATH"
          --api-key "$env:NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json

      - name: Upload performance reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: performance-release
          path: artifacts/performance/
          if-no-files-found: warn
