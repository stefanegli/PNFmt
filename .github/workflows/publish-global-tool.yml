name: Publish .NET global tool

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: publish-global-tool
  cancel-in-progress: false

jobs:
  publish:
    name: Publish PetchNaka.PNFmt.Cli
    runs-on: ubuntu-latest
    environment: nuget
    timeout-minutes: 10

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require a commit on the default branch
        shell: pwsh
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          $commit = (git rev-parse HEAD | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Could not resolve the tagged commit.' }
          git merge-base --is-ancestor $commit "origin/$env:DEFAULT_BRANCH"
          if ($LASTEXITCODE -ne 0) { throw 'Release tags must point to a commit on the default branch.' }
          "RELEASE_COMMIT=$commit" >> $env:GITHUB_ENV

      - name: Find successful Build for this commit
        id: build
        uses: actions/github-script@v9
        with:
          script: |
            const select = require('./.github/scripts/select-release-build.cjs');
            const result = await select({ github, context, commit: process.env.RELEASE_COMMIT });
            core.setOutput('run-id', result.runId);
            core.setOutput('artifact-id', result.artifactId);
            core.setOutput('version', result.version);
            core.info(`Reusing validated package from ${result.url}`);

      - name: Download validated release package
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.build.outputs.artifact-id }}
          path: artifacts/release-package
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ steps.build.outputs.run-id }}

      - name: Verify package version and source commit
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.build.outputs.version }}
        run: |
          $package = ./scripts/Test-ReleasePackage.ps1 -PackageDirectory artifacts/release-package -Version $env:PACKAGE_VERSION -Commit $env:RELEASE_COMMIT
          "VALIDATED_PACKAGE_PATH=$package" >> $env:GITHUB_ENV

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Validate trusted publishing configuration
        shell: pwsh
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_USER)) {
            throw "Set the repository variable 'NUGET_USER' to the nuget.org profile name."
          }

      - name: Log in to NuGet.org with trusted publishing
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish validated package
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: >
          dotnet nuget push "$env:VALIDATED_PACKAGE_PATH"
          --api-key "$env:NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
